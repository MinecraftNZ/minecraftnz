<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minecraft NZ</title>
    <style>
      body {
        margin: 0;
        background: url("assets/grass.jpg") center / cover no-repeat;
        color: #e7e5e4;
        font: 0.875rem / 1.25rem system-ui, sans-serif;
      }

      main {
        min-height: 100svh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }

      img {
        max-width: 100%;
        height: auto;
      }

      .archive {
        box-sizing: border-box;
        max-width: 28rem;
        margin-top: 1.5rem;
        padding: 1.25rem 1.5rem;
        border-radius: 4px;
        background: rgb(28 25 23 / 60%);
        text-align: center;
        backdrop-filter: blur(8px);
      }

      p {
        margin: 0;
      }

      a {
        display: inline-block;
        margin-top: 1rem;
        padding: 0.75rem 1.5rem;
        border-radius: 4px;
        background: #009966;
        color: #fff;
        font-size: 1.125rem;
        font-weight: 600;
        line-height: 1.75rem;
        text-decoration: none;
        transition: background-color 150ms;
      }

      a:hover {
        background: #00bc7d;
      }

      a:focus-visible {
        outline: 2px solid #fff;
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="assets/logo.png" alt="Minecraft NZ Logo" width="697" height="330" />
      <div class="archive">
        <p>
          Explore the history of NZ's first Minecraft community:<br />world
          downloads, interactive maps, screenshots, and more.
        </p>
        <a href="https://archive.minecraft.co.nz">Visit the Archive</a>
      </div>
    </main>
  </body>
</html>
